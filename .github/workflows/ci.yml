name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      # - run: npm run lint
      - run: npm run build
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Docker Buildx setup
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{vars.DOCKERHUB_USERNAME}}/todo-frontend:latest
            ${{vars.DOCKERHUB_USERNAME}}/todo-frontend:${{github.sha}}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    env:
      SSH_HOST: ${{secrets.SSH_HOST}}
      SSH_USERNAME: ${{secrets.SSH_USERNAME}}
      APP_DIR: /home/ubuntu/shorturl-frontend
    steps:
      - uses: actions/checkout@v7
      - name: set up SSH
        env:
          SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
      - name: Copy compose file to remote server
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.yml $SSH_USERNAME@$SSH_HOST:$APP_DIR
      - name: Deploy
        env:
          DOCKERHUB_USERNAME: ${{vars.DOCKERHUB_USERNAME}}
          DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
        run: |
          ssh -i ~/.ssh/id_rsa $SSH_USERNAME@$SSH_HOST \
          "DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' APP_DIR='${APP_DIR}' bash -s" << 'REMOTE'
          cd "${APP_DIR}"
          echo $DOCKERHUB_TOKEN | docker login -u $DOCKERHUB_USERNAME --password-stdin
          docker compose pull
          docker compose down
          docker compose up -d
          REMOTE